name: Firmware Tests

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-tests.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-tests.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: firmware/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests -v --hitl-port mock
